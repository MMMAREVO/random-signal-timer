<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0f3d20"/>
      <stop offset="0.6" stop-color="#061a0d"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="640" fill="url(#bg)"/>
  <g filter="url(#glow)" fill="#00e060" stroke="#00e060">
    <!-- crown -->
    <rect x="285" y="92" width="70" height="34" rx="10" stroke="none"/>
    <rect x="306" y="120" width="28" height="30" stroke="none"/>
    <!-- side button -->
    <rect x="452" y="148" width="44" height="30" rx="8" stroke="none" transform="rotate(45 474 163)"/>
    <!-- body -->
    <circle cx="320" cy="350" r="185" fill="none" stroke-width="38"/>
    <!-- random signal bars -->
    <g stroke="none">
      <rect x="203" y="320" width="34" height="60" rx="17"/>
      <rect x="253" y="265" width="34" height="170" rx="17"/>
      <rect x="303" y="300" width="34" height="100" rx="17"/>
      <rect x="353" y="240" width="34" height="220" rx="17"/>
      <rect x="403" y="305" width="34" height="90" rx="17"/>
    </g>
  </g>
</svg>
